[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = false
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
)/
'''


[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
unsafe-fixes = false  # отключаем удаление кода (неиспользуемого импорта и переменных)
exclude = [
    ".git",
    ".venv",
    "migrations",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
# Только базовые ошибки, которые могут сломать исполнение или быть опасными
select = ["F", "E", "I"]
ignore = ["E501", "F821"]  # длинные строки пусть проверяет black

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # разрешаем assert в тестах


[tool.bandit]
exclude_dirs = ["./.venv", "./tests", "./build"]  # Skip these directories
skips = ["B101"]  # Skip specific low-severity tests globally (e.g., assert_used)
